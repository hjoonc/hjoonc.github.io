<style>
  #cat-cursor {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 28px;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
  }

  .paw {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 16px;
    pointer-events: none;
    z-index: 9997;
    opacity: 0.55;
    transform-origin: center;
    animation: pawFade 0.9s ease-out forwards;
  }
  @keyframes pawFade {
    0%   { opacity: 0.55; transform: scale(1) rotate(var(--rot)); }
    100% { opacity: 0;    transform: scale(0.4) rotate(var(--rot)); }
  }

  .burst-particle {
    position: fixed;
    top: 0;
    left: 0;
    font-size: 20px;
    pointer-events: none;
    z-index: 9999;
    animation: burstOut 0.8s ease-out forwards;
  }
  @keyframes burstOut {
    0%   { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(0.6); }
    70%  { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); }
  }
</style>

<div id="cat-cursor">🐈‍⬛</div>

<script>
  // ---------- 고양이가 마우스를 따라다님 ----------
  const cat = document.getElementById('cat-cursor');
  let mouseX = 0, mouseY = 0;
  let catX = 0, catY = 0;

  function animateCat() {
    catX += (mouseX - catX) * 0.1;
    catY += (mouseY - catY) * 0.1;
    cat.style.left = catX + 'px';
    cat.style.top = catY + 'px';
    requestAnimationFrame(animateCat);
  }
  animateCat();

  // ---------- 발바닥 트레일 ----------
  let lastPawTime = 0;
  let pawToggle = false;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX + 35; // 고양이가 커서보다 살짝 오른쪽에 위치
    mouseY = e.clientY + 45; // 고양이는 커서보다 넉넉히 아래에서 따라옴

    const now = Date.now();
    if (now - lastPawTime < 120) return;
    lastPawTime = now;
    pawToggle = !pawToggle;

    const paw = document.createElement('div');
    paw.className = 'paw';
    paw.textContent = '🐾';
    const offsetX = pawToggle ? -6 : 6;
    paw.style.left = (e.clientX + offsetX) + 'px';
    paw.style.top = (e.clientY + 10) + 'px';
    paw.style.setProperty('--rot', (pawToggle ? -15 : 15) + 'deg');
    document.body.appendChild(paw);

    setTimeout(() => paw.remove(), 900);
  });

  // ---------- 클릭 시 발바닥 폭죽 ----------
  const burstEmojis = ['🐾'];

  document.addEventListener('click', (e) => {
    const count = 14;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'burst-particle';
      p.textContent = burstEmojis[Math.floor(Math.random() * burstEmojis.length)];

      const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.4 - 0.2);
      const distance = 60 + Math.random() * 60;
      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance;

      p.style.left = e.clientX + 'px';
      p.style.top = e.clientY + 'px';
      p.style.setProperty('--dx', dx + 'px');
      p.style.setProperty('--dy', dy + 'px');
      p.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');

      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }
  });
</script>
